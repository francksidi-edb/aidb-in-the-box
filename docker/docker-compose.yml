services:
  pg:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      secrets:
        - edb_token
    image: aidb-in-the-box
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AIBOX_ALLOWED_HOSTS: ${AIBOX_ALLOWED_HOSTS:-}   # extra host names for the app besides localhost / 127.0.0.1
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}               # empty: a new Jupyter token on every start
      AIBOX_TESTED_AIDB_VERSION: ${AIBOX_TESTED_AIDB_VERSION:-}   # empty: the version in box_server.py
    ports:
      - "127.0.0.1:5432:5432"   # Postgres
      - "127.0.0.1:8888:8888"   # Jupyter
      - "127.0.0.1:8765:8765"   # MCP endpoint
      - "127.0.0.1:8650:8650"   # AI in the Box (Flask)
    volumes:
      - pgdata:/var/lib/pgsql/18/data
      - pgfs:/tmp/pgfs   # documents for pgfs: the sample PDFs, uploads and downloads (filled from the image on first start)

secrets:
  edb_token:
    environment: EDB_TOKEN

volumes:
  pgdata:
  pgfs:
