<title>AI in the Box</title>
<link rel="icon" href="/static/favicon.ico" type="image/x-icon">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@500;600;700&family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell like the Data & AI Manager mockup. Dark top bar, grouped left nav, one working pane. */
:root{
  --bg:#EEF4F6; --surface:#FFFFFF; --fg:#1E3D4A; --muted:#567F8D; --line:#D3E1E6; --frost:#E8F2F5;
  --bar:#1E3D4A; --bar-fg:#FFFFFF; --bar-soft:#28495A; --bar-line:#3B6070; --accent:#28495A; --mist:#A8C2CA; --gold:#E7C568;
  --ok:#23765A; --info:#2D6A8A; --warn:#9A6200; --mute:#5E7480; --bad:#A33A3A;
  --f-head:'Roboto Condensed',system-ui,sans-serif; --f-body:'Roboto',system-ui,sans-serif; --f-mono:'Roboto Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12262E; --surface:#1A343F; --fg:#E8F2F5; --muted:#A8C2CA; --line:#2C4C59; --frost:#223F4B;
  --bar:#0E1E25; --bar-soft:#1A343F; --bar-line:#2C4C59; --accent:#A8C2CA;
  --ok:#5FC49C; --info:#78B8D8; --warn:#E7B24F; --mute:#93AAB5; --bad:#E58A8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12262E; --surface:#1A343F; --fg:#E8F2F5; --muted:#A8C2CA; --line:#2C4C59; --frost:#223F4B;
  --bar:#0E1E25; --bar-soft:#1A343F; --bar-line:#2C4C59; --accent:#A8C2CA;
  --ok:#5FC49C; --info:#78B8D8; --warn:#E7B24F; --mute:#93AAB5; --bad:#E58A8A; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{background:var(--bar);color:var(--bar-fg);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.brand{display:flex;align-items:center;gap:14px;font-family:var(--f-head);white-space:nowrap}
.brand img{height:26px;width:auto;display:block}
.brand span{color:#fff;font-size:19px;font-weight:600;padding-left:14px;border-left:1px solid var(--bar-line);line-height:26px}
.search{flex:1 1 260px;max-width:520px;display:flex;align-items:center;background:var(--bar-soft);border:1px solid var(--bar-line);border-radius:6px;padding:0 12px;height:36px}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#fff}
.search input::placeholder{color:var(--mist)}
.connpill{margin-left:auto;background:var(--bar-soft);border:1px solid var(--bar-line);color:var(--bar-fg);border-radius:999px;padding:4px 14px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.connpill i{width:8px;height:8px;border-radius:50%;background:var(--mist)}
.connpill.ok i{background:#5FC49C}.connpill.bad i{background:#E58A8A}.connpill.warn i{background:#E5C07B}
.frame{width:100%;height:calc(100vh - 190px);min-height:480px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.md h1,.md h2,.md h3{margin:16px 0 6px}.md p{margin:6px 0}.md ul{margin:6px 0;padding-left:20px}.md table{min-width:0;margin:8px 0}.md th,.md td{padding:5px 10px;border:1px solid var(--line)}
pre.code{position:relative;margin:8px 0;padding:12px 14px;background:var(--frost);border:1px solid var(--line);border-radius:8px;overflow-x:auto;font:12.5px/1.5 var(--f-mono);white-space:pre}
pre.code button{position:absolute;top:6px;right:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
[hidden]{display:none!important}
.p-ok{--c:var(--ok)}.p-warn{--c:var(--warn)}.p-bad{--c:var(--bad)}.p-info{--c:var(--info)}.p-mute{--c:var(--mute)}
tr.rowd{cursor:pointer}tr.rowd:hover td{background:var(--frost)}tr.rowd td.nm{font-weight:500}
tr.rowd[aria-expanded="true"] td{background:var(--frost)}tr.rowx td{padding:0 12px 12px;background:var(--frost)}tr.rowx pre.code{margin:0;background:var(--surface);max-height:320px;overflow:auto}
tr.fnr{cursor:pointer}tr.fnr:hover td{background:var(--frost)}tr.fnx td{padding:0 12px 12px;background:var(--frost)}tr.fnx pre.code{margin:0;background:var(--surface);max-height:420px;overflow:auto;white-space:pre-wrap}
textarea.sqlbox{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);padding:12px 14px;font:13px/1.55 var(--f-mono);resize:vertical;min-height:140px}
.ck{align-items:baseline}
.btn{display:inline-block;background:var(--accent);color:var(--surface);border:0;border-radius:6px;padding:6px 14px;cursor:pointer;text-decoration:none;font-size:13px}
.btn.alt{background:var(--surface);color:var(--fg);border:1px solid var(--line)}
.ck{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:baseline}
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 56px)}
nav.side{background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;padding-left:max(10px,env(safe-area-inset-left,0px))}
.navgroup{margin-bottom:3px}
.navhead,.navitem{display:flex;align-items:center;gap:10px;width:100%;border-radius:6px;text-decoration:none;color:var(--accent);cursor:pointer}
.navhead{min-height:30px;padding:3px 10px;font:600 15px var(--f-head)}
.navitem{min-height:26px;padding:2px 10px 2px 26px;gap:9px;font:400 13.5px var(--f-body)}
.navhead:hover,.navitem:hover{background:var(--frost)}
.navhead.within{color:var(--fg)}
.navhead.on,.navitem.on{background:var(--accent);color:var(--surface);box-shadow:inset 3px 0 0 var(--gold)}
.navitem span{margin-left:auto;font:12px var(--f-mono);opacity:.7}
.navitem svg,.navhead svg{flex:none}
main{min-width:0;padding-block:24px 56px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px}
h1{font:600 30px/1.15 var(--f-head);margin:0 0 6px;text-wrap:balance}
h2{font:600 20px/1.2 var(--f-head);margin:32px 0 10px}
h3{font:600 16px/1.25 var(--f-head);margin:0}
.lead{color:var(--muted);max-width:68ch;margin:0 0 20px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;text-align:left;cursor:pointer;display:block;width:100%}
.tile:hover{border-color:var(--muted)}
.tile b{display:block;font:600 30px/1.1 var(--f-head);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.pad{padding:16px 18px}
.layers{display:grid;gap:8px}
.layer{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.layer>div:first-child{font:600 15px var(--f-head)}
.layer>div:first-child small{display:block;font:400 12px var(--f-body);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--frost);border-radius:999px;padding:2px 10px 2px 8px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--mute));flex:none}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}
.s-Complete{--c:var(--ok)}.s-Accepted{--c:var(--info)}.s-Excluded,.s-None{--c:var(--mute)}.s-Later,.s-Hold{--c:var(--warn)}.s-Idea{--c:var(--muted)}
.tag{display:inline-block;font:500 11.5px var(--f-mono);padding:1px 7px;border-radius:4px;background:var(--frost);color:var(--fg);border:1px solid var(--line)}
.tag.need{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line))}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar select,.toolbar input{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;height:34px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{font-size:inherit;line-height:inherit;border-collapse:collapse;width:100%;min-width:760px}
th{font:600 12px var(--f-head);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--frost);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .d{color:var(--muted);font-size:13px;margin-top:2px;max-width:62ch}
td.id,.mono{font-family:var(--f-mono);font-size:12.5px}
.demos{display:grid;gap:12px}
.demo{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.demo>button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;width:100%;padding:14px 18px;cursor:pointer}
.demo>button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.demo>button p{margin:2px 0 0;color:var(--muted)}
.demo .body{padding:0 18px 18px;display:none;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.demo.open .body{display:grid}
.demo h4{font:600 12px var(--f-head);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.demo ul{margin:0;padding-left:18px}
.demo li{margin:2px 0}
.demo code,code{font:12.5px var(--f-mono);background:var(--frost);padding:1px 5px;border-radius:4px}
.q{border-left:3px solid var(--line);padding:2px 10px;margin:4px 0;font-style:normal}
.note{border:1px solid color-mix(in srgb,var(--warn) 40%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--surface));border-radius:8px;padding:12px 16px;margin:12px 0}
.note b{color:var(--warn)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  nav.side{border-right:0;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:8px 12px;padding-left:max(12px,env(safe-area-inset-left,0px))}
  .navgroup{display:contents}
  .navgroup>.navhead:not(.solo){display:none}
  .navhead,.navitem{width:auto;white-space:nowrap;padding:4px 12px;font:500 14px var(--f-body)}
  .navitem svg,.navhead svg{display:none}
  .layer{grid-template-columns:1fr}
  h1{font-size:26px}
}
@media (prefers-reduced-motion:no-preference){.tile,.chip{transition:border-color .15s}}
.two>*,.cards>*,.grid>*{min-width:0}
.panel h3,.agcard p{overflow-wrap:anywhere}
.tag{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.agcard .agh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 10px;align-items:baseline}
.agcard .agh h3{min-width:0;margin:0}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:8px}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:16px}
.optcard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;color:var(--fg);font:inherit}
.optcard b{font:600 26px/1 var(--f-head);color:var(--accent)}
.optcard span{font-size:13px;color:var(--muted)} .optcard strong{color:var(--fg);font-size:14px}
.optcard[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--gold)}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:12px 0}
.frm label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.frm input,.frm select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;height:36px;color:var(--fg);min-width:0}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13px}
pre.log{background:#0f2630;color:#d7e6ea;border-radius:8px;padding:12px 14px;max-height:340px;overflow:auto;font:12px/1.5 'Roboto Mono',monospace;white-space:pre-wrap;margin:12px 0 0}
.res{margin-top:10px;font-size:13px}.res.ok{color:var(--ok,#2f7d4f)}.res.err{color:var(--warn)}
/* demo apps (apps.js, tokenboss.js) */
.msg{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--surface)}
.msg.ok{border-left-color:var(--ok)}.msg.err{border-left-color:var(--bad)}.msg.warn{border-left-color:var(--warn)}
.msg ul{margin:6px 0 0;padding-left:20px}
.working{display:flex;align-items:center;gap:14px;padding:14px 18px;margin:10px 0;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ring{width:26px;height:26px;flex:none;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .9s linear infinite}
.wtext{flex:1}.track{position:relative;height:5px;margin-top:8px;overflow:hidden;border-radius:3px;background:var(--line)}
.track .bar{position:absolute;top:0;height:100%;width:35%;border-radius:3px;background:var(--accent);animation:slide 1.3s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes slide{0%{left:-35%}100%{left:100%}}
tr.hl td{background:color-mix(in srgb,var(--gold) 30%,transparent);font-weight:600}
.frm input[type=checkbox]{height:auto;width:auto}
.frm label.chk{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:13px}
.tw.app th{white-space:normal;padding:8px 9px;letter-spacing:.03em;vertical-align:bottom}.tw.app td{padding:8px 9px;white-space:nowrap}.tw.app td.w{white-space:normal;min-width:150px;max-width:380px}
.lnk{white-space:nowrap;background:none;border:0;padding:2px 4px;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:2px}
.lnk:hover{color:var(--fg)}
hr.sep{border:0;border-top:1px solid var(--line);margin:26px 0 18px}
.tabs{margin-bottom:0}.tabs button{border-radius:6px 6px 0 0;padding:6px 16px}
details{margin:6px 0}details>summary{cursor:pointer}
pre.diff .add{background:color-mix(in srgb,var(--ok) 18%,transparent);display:inline-block;width:100%}
pre.diff .del{background:color-mix(in srgb,var(--bad) 18%,transparent);display:inline-block;width:100%}
.cvwrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.cvside{position:sticky;top:12px}
.cvitem{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cvitem:hover{background:var(--frost)}.cvitem.on{background:var(--accent);color:var(--surface)}
.cvhome{max-width:620px;margin:6vh auto 0;text-align:center}
.cvlogo{font:600 clamp(30px,4vw,56px)/1.1 var(--f-head);letter-spacing:-1px;color:var(--accent)}
.cvtag{color:var(--muted);margin:6px 0 26px}
.cvsel{width:100%;max-width:420px;height:38px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 10px;color:var(--fg);margin-bottom:14px}
.cvform{display:flex;gap:8px;margin:14px 0;align-items:center}
.cvform input{flex:1;min-width:0;height:44px;border-radius:24px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 20px;font-size:16px;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.cvform .btn{height:40px;border-radius:20px;padding:0 20px}
.cvmsg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin:10px 0}
.cvmsg.user{background:var(--frost)}.cvmsg .who{font:600 12px var(--f-head);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
@media (max-width:760px){.cvwrap{grid-template-columns:1fr}.cvside{position:static}}
</style>

<header class="top">
  <div class="brand"><img src="static/logo.png" alt="EDB Postgres AI"><span>AI in the Box</span></div>
  <button class="connpill" id="conn" aria-label="Open system check">Checking database…</button>
</header>
<div class="shell">
  <nav class="side" id="nav" aria-label="Sections"></nav>
  <main><div class="wrap" id="view"></div></main>
</div>

<script src="/static/inspect.js"></script>
<script src="/static/apps.js"></script>
<script src="/static/tokenboss.js"></script>
<script>
let D;
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={view:'overview',opt:''};

/* ---------- views ---------- */
function overview(){
  const P=(t,x)=>`<div class="panel pad"><h3>${t}</h3><p style="margin:6px 0 0;color:var(--muted)">${x}</p></div>`;
  return `<h1>AI in the Box</h1>
  <p class="lead">Sample apps and Jupyter Notebooks for using EDB Agent Factory.</p>
  <h2>What is Agent Factory?</h2>
  <p class="lead" style="max-width:none">Agent Factory is EDB's set of Postgres extensions and applications for building, running, and governing AI agents directly on your Postgres data, without moving your data to a separate vector database or agent framework. It includes the extensions that implement Search, Context, Runtime, and Governance, as well as the packages that install and manage them. The extensions include AIDB, PGFS, and Vector Plus. <a href="https://www.enterprisedb.com/docs/edb-postgres-ai/agent-factory/packages/" target="_blank" rel="noopener">Agent Factory documentation</a></p>
  <h2>What is AIDB?</h2>
  <p class="lead" style="max-width:none">AIDB is an EDB-maintained Postgres extension that builds AI data workflows into the database. You define SQL pipelines that parse, chunk, embed and index your data, then query it with semantic search, hybrid search and LLM-powered retrieval, or put agents on top of it. <a href="https://www.enterprisedb.com/docs/aidb/latest/" target="_blank" rel="noopener">AIDB documentation</a></p>
  <div class="cards">
    ${P('Models','Run local, self-hosted models or connect external providers such as Anthropic, Google Gemini, OpenAI and others. Each one is registered as a named model with <code>aidb.create_model()</code>.')}
    ${P('Agents','In-database agents that reason over several steps and call tools to answer a question. Define one with <code>aidb.create_agent()</code> and talk to it with <code>aidb.agent_converse()</code>; you can also delegate work between agents.')}
    ${P('Built-in and custom tools','A catalog of built-in tools such as <code>run_sql_query</code> and <code>catalog_list_objects</code>, custom SQL tools that you write (for example <code>search_tax_docs</code> in the RAG demo), and MCP tools imported from external MCP servers.')}
    ${P('Governance','Limit an agent\'s tool calls to a specific Postgres role with purposes created by <code>aidb.create_purpose()</code>, and record every allow or deny decision.')}
    ${P('Pipelines','SQL pipelines that read from a source, transform the data with steps such as <code>ParsePdf</code> and <code>ChunkText</code>, and write the result to a knowledge base.')}
    ${P('Knowledge bases','Searchable stores built on unstructured and semi-structured data, such as PDFs and text, with semantic and hybrid search and vector indexes. Query one with <code>aidb.retrieve_text()</code>.')}
    ${P('Semantic knowledge bases','Index your schema (tables, views, columns and comments) with <code>aidb.create_semantic_kb()</code> so a plain-English question is converted into SQL on your data. This simplifies access to the data.')}
    ${P('SQL functions','Inline scalar and aggregate functions that call a model from SQL, such as <code>aidb.summarize_text()</code> for one row and <code>aidb.summarize_text_aggregate()</code> for a whole group, plus functions for parsing, chunking, OCR and embedding.')}
    ${P('Conversation logging','Built-in logging of agent conversations and steps in the <code>aidb.conversations</code> and <code>aidb.conversation_log</code> tables, for debugging, optimizing agents and auditing.')}
  </div>
  <h2>What is PGFS?</h2>
  <p class="lead" style="max-width:none">PGFS (Postgres File System) is a Postgres extension, implemented as a foreign data wrapper, that lets the database access, store and retrieve files in external storage. The demos use it with AIDB to point a pipeline at a folder of documents, such as PDFs, so they can be parsed, split into chunks and indexed for search, with access limited to the paths you allow. <a href="https://www.enterprisedb.com/docs/pg_extensions/pgfs/" target="_blank" rel="noopener">PGFS documentation</a></p>
  <div class="cards">
    ${P('Storage locations','Register a folder or bucket with <code>pgfs.create_storage_location()</code>. Your files stay where they are and the database reads them through the location.')}
    ${P('Many storage types','S3-compatible buckets (AWS, MinIO and others), Azure, Google Cloud Storage and local file systems.')}

function md(t){
  const inl=x=>esc(x).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>');
  const L=t.split('\n'),o=[];let i=0;
  while(i<L.length){const l=L[i];
    if(l.startsWith('```')){const c=[];i++;while(i<L.length&&!L[i].startsWith('```')){c.push(L[i]);i++}i++;o.push('<pre class="code">'+esc(c.join('\n'))+'</pre>');continue}
    const h=l.match(/^(#{1,4})\s+(.*)/);if(h){o.push('<h'+Math.min(h[1].length+1,4)+'>'+inl(h[2])+'</h'+Math.min(h[1].length+1,4)+'>');i++;continue}
    if(/^\s*\|/.test(l)&&/^\s*\|[\s:|-]+\|\s*$/.test(L[i+1]||'')){const rows=[l];i+=2;while(i<L.length&&/^\s*\|/.test(L[i])){rows.push(L[i]);i++}
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      o.push('<div class="tw"><table><thead><tr>'+cells(rows[0]).map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.slice(1).map(r=>'<tr>'+cells(r).map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue}
    if(/^\s*[-*]\s+/.test(l)){const it=[];while(i<L.length&&/^\s*[-*]\s+/.test(L[i])){it.push(L[i].replace(/^\s*[-*]\s+/,''));i++}o.push('<ul>'+it.map(x=>'<li>'+inl(x)+'</li>').join('')+'</ul>');continue}
    if(!l.trim()){i++;continue}
    const p=[];while(i<L.length&&L[i].trim()&&!/^(```|#{1,4}\s|\s*[-*]\s)/.test(L[i])){p.push(L[i]);i++}o.push('<p>'+inl(p.join(' '))+'</p>');}
  return o.join('');
}

  }).catch(()=>{$('#nbbody').innerHTML='<div class="empty">Could not load the notebook.</div>'});

}

function statusHtml(s){
  const row=(ok,label,detail)=>`<span class="pill s-${ok?'Complete':'Hold'}">${ok?'OK':'Needs attention'}</span><div><b>${label}</b><div class="d" style="color:var(--muted)">${detail}</div></div>`;
  const c=s.connection||{};
  let h='<div class="ck">'+row(s.psql,'psql client',s.psql?'Found on PATH.':'The psql client is missing from the container image.')
   +row(s.connected,'Database connection',s.connected?esc(s.server):esc(s.error||'')+'<br>The container connects with host '+esc(c.PGHOST)+', port '+esc(c.PGPORT)+', database '+esc(c.PGDATABASE)+', user '+esc(c.PGUSER)+'. Check the container log: <code>docker compose logs pg</code>.');
  if(s.connected){
    h+=(s.extensions||[]).map(e=>row(!!e.installed&&!e.update_pending,e.name,e.update_pending
      ?'Not updated: the installed package is version '+esc(e.library)+', but the database still has the SQL objects of version '+esc(e.installed)+', and functions of the extension can fail until they match. Run <code>ALTER EXTENSION '+esc(e.name)+' UPDATE;</code> and its error says what blocks the update. The container runs it on every start and logs a failure: in the <code>docker</code> folder, <code>docker compose logs pg</code>.'
      :e.installed?'Installed, version '+esc(e.installed):(e.available?'Available. Run <code>CREATE EXTENSION '+esc(e.name)+(e.name==='aidb'?' CASCADE':'')+';</code>':'Not included in this image.'))).join('');
    const v=s.aidb_version,ax=(s.extensions||[]).find(e=>e.name==='aidb');
    if(v&&!(ax&&ax.update_pending)) h+=row(v.compatible,'AIDB version',v.compatible?'Version '+esc(v.installed)+', the version the notebooks and apps were tested with ('+esc(v.tested)+').'
      :'Version '+esc(v.installed)+' is installed, but the notebooks and apps were tested with '+esc(v.tested)+', so some steps may not work as described. The image installs the latest AIDB release. Once you have tested this one, set <code>AIBOX_TESTED_AIDB_VERSION</code> in <code>docker/.env</code>.');
    h+=row(s.demo_data,'Sample data',s.demo_data?'The Orbit Cloud support desk tables (schema <code>support</code>) are loaded.':'Schema <code>support</code> is missing. It is created by <code>docker/bootstrap.sql</code> on the first start.');
    if(s.aidb_counts) h+=row(true,'AIDB objects',s.aidb_counts.models+' models, '+s.aidb_counts.agents+' agents registered.');
  }
  h+=row(true,'Inspect pages','Built in: open Inspect in the menu.');
  return h+'</div>';
}
function connPill(){
  const el=$('#conn'); el.onclick=()=>{location.hash='status'};
  fetch('/api/status').then(r=>r.json()).then(s=>{
    const a=(s.extensions||[]).find(e=>e.name==='aidb');
    const v=s.aidb_version,stale=(s.extensions||[]).filter(e=>e.update_pending),failed=stale.length>0,untested=v&&!v.compatible;
    el.className='connpill '+(s.connected&&a&&a.installed?(failed?'bad':untested?'warn':'ok'):'bad');
    el.title=failed?'Not updated to the installed package: '+stale.map(e=>e.name).join(', ')+'. Open the system check for details.'
      :untested?'AIDB '+v.installed+' is not the tested version ('+v.tested+'). Open the system check for details.':'';
    el.innerHTML='<i></i>'+(s.connected?(a&&a.installed?'Connected · AIDB '+esc(a.installed)+(failed?' (update needed)':untested?' (untested)':''):'Connected · AIDB not installed'):'Database not connected');
  }).catch(()=>{el.className='connpill bad';el.innerHTML='<i></i>Server not reachable'});
}
